scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
scrollback_lines 9999

enable_audio_bell no


## Look and feel

cursor_shape block
shell_integration no-cursor
window_padding_width 1

# text
font_family Cascadia Mono NF Regular
font_size 10.0
disable_ligatures always

# tab bar
tab_bar_style custom
tab_title_template " {fmt.fg.color1}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{index}:{tab.active_oldest_exe} "

active_tab_font_style none

bell_on_tab "🔔 "
tab_activity_symbol "*"

# additional tab bar color config in theme files


## Mouse behavior

copy_on_select yes

# open link (with no delay) with ctrl+click
mouse_map left click ungrabbed no_op
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link


## Keyboard shortcuts

# font resizing
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# window resizing
map super+minus resize_window shorter 3
map super+equal resize_window taller 3

# Add tmux-style key mappings using ctrl+space prefix.
#
# This calls a custom mux-prefix-dispatch.sh script
# which passes the keypresses to the terminal multiplexer if one is running.
# Otherwise, it performs a native Kitty action.
action_alias mux remote_control_script mux-prefix-dispatch.sh

map ctrl+space>c       mux c       new_tab
map ctrl+space>h       mux h       previous_tab
map ctrl+space>l       mux l       next_tab
map ctrl+space>n       mux n       next_tab
map ctrl+space>p       mux p       previous_tab
map ctrl+space>shift+H mux shift+h move_tab_backward
map ctrl+space>shift+L mux shift+l move_tab_forward

map ctrl+space>ctrl+space mux ctrl+space goto_tab -1
map ctrl+space>1          mux 1          goto_tab 1
map ctrl+space>2          mux 2          goto_tab 2
map ctrl+space>3          mux 3          goto_tab 3
map ctrl+space>4          mux 4          goto_tab 4
map ctrl+space>5          mux 5          goto_tab 5
map ctrl+space>6          mux 6          goto_tab 6
map ctrl+space>7          mux 7          goto_tab 7
map ctrl+space>8          mux 8          goto_tab 8
map ctrl+space>9          mux 9          goto_tab 9
map ctrl+space>0          mux 10         goto_tab 10

map ctrl+space>ctrl+h mux ctrl+h neighboring_window left
map ctrl+space>ctrl+j mux ctrl+j neighboring_window down
map ctrl+space>ctrl+k mux ctrl+k neighboring_window up
map ctrl+space>ctrl+l mux ctrl+l neighboring_window right

map ctrl+space>minus mux minus resize_window shorter 3
map ctrl+space>plus  mux plus  resize_window taller 3
map ctrl+space>equal mux equal resize_window reset

map ctrl+space>s mux s launch --location=hsplit
map ctrl+space>v mux v launch --location=vsplit

map ctrl+space>z mux z toggle_layout stack

map ctrl+space>t>s goto_session ts
map ctrl+space>t>w goto_session wjn

map ctrl+space>shift+up    move_window up
map ctrl+space>shift+down  move_window down
map ctrl+space>shift+left  move_window left
map ctrl+space>shift+right move_window right

map ctrl+space>space mux space show_scrollback

# resize mode: ctrl+space > r
map --new-mode resize ctrl+space>r
map --mode resize esc    pop_keyboard_mode
map --mode resize ctrl+c pop_keyboard_mode

map --mode resize j       resize_window taller 3
map --mode resize shift+j resize_window taller 10
map --mode resize k       resize_window shorter 3
map --mode resize shift+k resize_window shorter 10

map --mode resize minus       resize_window shorter 3
map --mode resize shift+minus resize_window shorter 10
map --mode resize equal       resize_window taller 3
map --mode resize shift+equal resize_window taller 10

map --mode resize h       resize_window narrower 3
map --mode resize shift+h resize_window narrower 10
map --mode resize l       resize_window wider 3
map --mode resize shift+l resize_window wider 10

map --mode resize shift+comma  resize_window narrower 3
map --mode resize shift+period resize_window wider 3

map --mode resize ctrl+r resize_window reset

# platform overrides
include platform.conf

# local overrides
include local.conf

scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
scrollback_lines 9999

enable_audio_bell no


## Look and feel

cursor_shape block
shell_integration no-cursor
window_padding_width 1

# text
font_family Cascadia Mono NF Regular
font_size 10.0
disable_ligatures always

# tab bar
tab_bar_style custom
tab_title_template " {fmt.fg.color1}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{index}:{tab.active_oldest_exe} "

active_tab_font_style none

bell_on_tab "🔔 "
tab_activity_symbol "*"

# additional tab bar color config in theme files


## Mouse behavior

copy_on_select yes

# open link (with no delay) with ctrl+click
mouse_map left click ungrabbed no_op
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

enabled_layouts splits:equalize_on_window_close=true,stack

## Keyboard shortcuts

# font resizing
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Add tmux-style key mappings using ctrl+space prefix.
#
# This calls a custom mux-prefix-dispatch.sh script
# which passes the keypresses to the terminal multiplexer if one is running.
# Otherwise, it performs a native Kitty action.
action_alias mux  remote_control_script mux-dispatch.sh
action_alias muxp remote_control_script mux-dispatch.sh --prefix

# window resizing
map super+minus        mux super+minus resize_window shorter 3
map super+equal        mux super+equal resize_window taller 3

map ctrl+space>c       muxp c       new_tab_with_cwd
map ctrl+space>h       muxp h       previous_tab
map ctrl+space>l       muxp l       next_tab
map ctrl+space>p       muxp p       previous_tab
map ctrl+space>n       muxp n       next_tab
map ctrl+space>shift+p muxp shift+p move_tab_backward
map ctrl+space>shift+n muxp shift+n move_tab_forward

map ctrl+space>ctrl+space muxp ctrl+space goto_tab -1
map ctrl+space>1          muxp 1          goto_tab 1
map ctrl+space>2          muxp 2          goto_tab 2
map ctrl+space>3          muxp 3          goto_tab 3
map ctrl+space>4          muxp 4          goto_tab 4
map ctrl+space>5          muxp 5          goto_tab 5
map ctrl+space>6          muxp 6          goto_tab 6
map ctrl+space>7          muxp 7          goto_tab 7
map ctrl+space>8          muxp 8          goto_tab 8
map ctrl+space>9          muxp 9          goto_tab 9
map ctrl+space>0          muxp 10         goto_tab 10

map ctrl+space>ctrl+h muxp ctrl+h neighboring_window left
map ctrl+space>ctrl+j muxp ctrl+j neighboring_window down
map ctrl+space>ctrl+k muxp ctrl+k neighboring_window up
map ctrl+space>ctrl+l muxp ctrl+l neighboring_window right

map ctrl+space>minus muxp minus resize_window shorter 3
map ctrl+space>plus  muxp plus  resize_window taller 3
map ctrl+space>equal muxp equal resize_window reset

map ctrl+space>s muxp s launch --location=hsplit --cwd=current
map ctrl+space>v muxp v launch --location=vsplit --cwd=current

map ctrl+space>z muxp z toggle_layout stack

map ctrl+space>t>s goto_session ts
map ctrl+space>t>w goto_session wjn

map ctrl+space>shift+k muxp shift+k move_window up
map ctrl+space>shift+j muxp shift+j move_window down
map ctrl+space>shift+h muxp shift+h move_window left
map ctrl+space>shift+l muxp shift+l move_window right

map ctrl+space>space mux space show_scrollback

# resize mode: ctrl+space > r
# Declare resize mode on an unused key, then enter it through the mux dispatch,
# so that multiplexers get ctrl+space>r when they are running.
map --new-mode resize f35
map ctrl+space>r muxp r push_keyboard_mode resize

map --mode resize esc    pop_keyboard_mode
map --mode resize ctrl+c pop_keyboard_mode

map --mode resize j       resize_window taller 3
map --mode resize shift+j resize_window taller 10
map --mode resize k       resize_window shorter 3
map --mode resize shift+k resize_window shorter 10

map --mode resize minus       resize_window shorter 3
map --mode resize shift+minus resize_window shorter 10
map --mode resize equal       resize_window taller 3
map --mode resize shift+equal resize_window taller 10

map --mode resize h       resize_window narrower 3
map --mode resize shift+h resize_window narrower 10
map --mode resize l       resize_window wider 3
map --mode resize shift+l resize_window wider 10

map --mode resize shift+comma  resize_window narrower 3
map --mode resize shift+period resize_window wider 3

map --mode resize ctrl+r resize_window reset

# platform overrides
include platform.conf

# local overrides
include local.conf
